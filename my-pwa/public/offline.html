<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c1322" />
    <title>Offline · INTERNet</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { margin: 0 auto 1.5rem; max-width: 22rem; color: #475569; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #1e3a8a;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>INTERNet needs a connection to load your records. Check your data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
