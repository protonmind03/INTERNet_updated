name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internet_ojt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internet_ojt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    # None of these are secrets. The database lives only for this run, and
    # the seed script refuses anything but internet_ojt on a loopback host.
    env:
      DATABASE_PUBLIC_URL: postgresql://postgres:postgres@localhost:5432/internet_ojt
      JWT_SECRET: ci-only-signing-key-never-used-outside-this-workflow
      PORT: "5000"
      FRONTEND_URL: http://localhost:5173
      PRIVATE_UPLOAD_DIR: /tmp/internet-ci-uploads
      API_BASE_URL: http://127.0.0.1:5000
      # Lets the one test that writes a real attendance log run; this
      # database is thrown away after the job.
      ALLOW_TEST_WRITES: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Neither needs the database: dates formatted without a time zone,
      # and a registered route that no test names, both fail the build.
      - name: Dates name their time zone
        run: npm run lint

      - name: Every route has a test
        run: npm run check:route-tests

      # Iteration 17: docs/ARCHITECTURE.md is generated from the route
      # registrations and service imports; a change that alters them without
      # regenerating it (npm run docs:architecture) fails here.
      - name: The architecture diagram matches the code
        run: npm run docs:architecture -- --check

      # Iteration 15: the nightly backup test runs the real pg_dump, which must be as
      # new as the database (postgres:18 above); the runner's own is older.
      - name: PostgreSQL 18's pg_dump, for the backup test
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-18.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed the demo accounts
        run: npm run db:seed-demo

      - name: Start the API
        run: |
          npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$API_BASE_URL/api/health" > /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 1
          done
          echo "The API did not answer /api/health within 30 seconds."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run the API tests
        run: npm test

      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: my-pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-pwa/package-lock.json

      - run: npm ci

      - run: npm run build

      # Iteration 14: the build is still an installable, offline-capable PWA
      # (manifest fields and icon sizes, the service worker, offline.html,
      # the iPhone start-up images). scripts/check-pwa.mjs says what failed.
      - name: The build is still a PWA
        run: npm run check:pwa

      - run: npm run lint

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internet_ojt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d internet_ojt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # None of these are secrets. A real browser drives the built site
    # against an API and database that live only for this run.
    env:
      DATABASE_PUBLIC_URL: postgresql://postgres:postgres@localhost:5432/internet_ojt
      JWT_SECRET: ci-only-signing-key-never-used-outside-this-workflow
      PORT: "5000"
      FRONTEND_URL: http://localhost:4173
      PRIVATE_UPLOAD_DIR: /tmp/internet-e2e-uploads
      VITE_API_URL: http://127.0.0.1:5000
      E2E_API_URL: http://127.0.0.1:5000
      E2E_BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            my-pwa/package-lock.json
            e2e/package-lock.json

      - name: Start the API with the demo accounts
        working-directory: backend
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed-demo
          npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$E2E_API_URL/api/health" > /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 1
          done
          echo "The API did not answer /api/health within 30 seconds."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Build and serve the site
        working-directory: my-pwa
        run: |
          npm ci
          npm run build
          npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/site.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$E2E_BASE_URL/" > /dev/null; then
              echo "Site is up."
              exit 0
            fi
            sleep 1
          done
          echo "The site did not answer within 30 seconds."
          cat "$RUNNER_TEMP/site.log"
          exit 1

      - name: Install the test runner
        working-directory: e2e
        run: npm ci

      - name: Keep the browser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      # Iteration 14: Lighthouse (mobile) on the sign-in page and each
      # portal's first page, against the same built site. It reports and
      # does not fail the build over a score; the summary appears on the
      # run's page and the full reports are kept below.
      - name: Lighthouse (mobile)
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npm run lighthouse

      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: e2e/lighthouse-reports
          retention-days: 30
          if-no-files-found: warn

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Show the API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
